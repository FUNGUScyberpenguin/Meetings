name: Build Windows app

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # attach files to a GitHub release when a v* tag is pushed

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev] "pyinstaller>=6.10"

      - name: Unit tests
        run: python -m pytest -q

      - name: Build exe
        run: pyinstaller packaging/MeetingRecorder.spec --noconfirm --clean

      - name: Self-test the built exe
        shell: pwsh
        run: |
          # Speak a sentence into a WAV so the packaged app has something real to transcribe.
          $wav = Join-Path $PWD "speech.wav"
          $report = Join-Path $PWD "selftest.json"
          Add-Type -AssemblyName System.Speech
          $tts = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $tts.SetOutputToWaveFile($wav)
          $tts.Speak("Welcome to the weekly planning meeting. Today we will review the budget.")
          $tts.Dispose()

          $p = Start-Process -FilePath "dist\MeetingRecorder\MeetingRecorder.exe" `
                -ArgumentList "--selftest", "`"$report`"", "`"$wav`"" -Wait -PassThru
          Get-Content $report
          if ($p.ExitCode -ne 0) { throw "Self-test failed with exit code $($p.ExitCode)" }

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $v = python -c "import meeting_recorder; print(meeting_recorder.__version__)"
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
            $env:PATH += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          iscc /DAppVersion=${{ steps.version.outputs.version }} packaging\installer.iss

      - name: Zip portable build
        shell: pwsh
        run: Compress-Archive -Path dist\MeetingRecorder -DestinationPath dist\MeetingRecorder-portable-${{ steps.version.outputs.version }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MeetingRecorder-windows
          path: |
            dist/MeetingRecorder-Setup-*.exe
            dist/MeetingRecorder-portable-*.zip
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MeetingRecorder-Setup-*.exe
            dist/MeetingRecorder-portable-*.zip
