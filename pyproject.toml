[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-recorder"
version = "0.1.0"
description = "Record meetings from your desktop and transcribe them locally with Whisper."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # soundcard 0.4.5 still calls numpy.fromstring, which NumPy 2 removed.
    "numpy>=1.24,<2",
    "soundcard>=0.4.5",
    "soundfile>=0.12",
    "faster-whisper>=1.1",
    # Tray icon. Windows only: the Mac build uses the Dock instead.
    "pystray>=0.19; sys_platform == 'win32'",
    "pillow>=10",
    # Splits the other side of the call by voice so people can be named.
    "sherpa-onnx>=1.12",
    # Certificates for the one-time model downloads in the packaged Mac app.
    "certifi",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
meeting-recorder = "meeting_recorder.__main__:main"

[project.gui-scripts]
meeting-recorder-gui = "meeting_recorder.app:main"

[tool.setuptools]
packages = ["meeting_recorder"]

[tool.setuptools.package-data]
meeting_recorder = ["assets/*"]
